<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — Header Controls Demo</title>
<style>
  :root{
    --bg:#F4F0E7;
    --bg-2:#EEE9DE;
    --panel:#F8F4EC;
    --ink:#252A2E;
    --muted:#77766F;
    --line:#BDB8AC;
    --line-strong:#77776F;
    --blue:#2D6F9F;
    --orange:#D9783B;
    --yellow:#C5A33A;
    --red:#A85B56;
    --green:#5E846D;
    --shadow:0 12px 28px rgba(41,39,34,.10);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 12% 18%, rgba(45,111,159,.08), transparent 24%),
      radial-gradient(circle at 86% 72%, rgba(217,120,59,.06), transparent 20%),
      var(--bg);
    color:var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow:hidden;
    transition:background .35s ease,color .35s ease;
  }

  /*noinspection CssUnusedSymbol*/
  body[data-theme="dark"]{
    --bg:#111417;
    --bg-2:#181C20;
    --panel:#171B1F;
    --ink:#E9E6DE;
    --muted:#A6A39B;
    --line:#454B50;
    --line-strong:#778087;
    --shadow:0 16px 36px rgba(0,0,0,.28);
    background:
      radial-gradient(circle at 16% 20%, rgba(45,111,159,.12), transparent 22%),
      radial-gradient(circle at 86% 72%, rgba(217,120,59,.08), transparent 20%),
      var(--bg);
  }

  .stage{
    width:min(860px, calc(100vw - 36px));
    min-height:360px;
    display:grid;
    place-items:center;
    position:relative;
  }

  .guide{
    position:absolute;
    left:24px;
    top:24px;
    font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.14em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .guide::before{
    content:"";
    display:inline-block;
    width:22px;
    height:1px;
    background:var(--orange);
    vertical-align:middle;
    margin-right:10px;
    transform:translateY(-1px);
  }

  .cluster{
    position:relative;
    display:flex;
    gap:14px;
    padding:12px;
    background:color-mix(in srgb,var(--panel) 94%, transparent);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }

  .cluster::before,
  .cluster::after{
    content:"";
    position:absolute;
    width:8px;height:8px;
    pointer-events:none;
  }
  .cluster::before{
    left:-1px;top:-1px;
    border-left:2px solid var(--ink);
    border-top:2px solid var(--ink);
  }
  .cluster::after{
    right:-1px;bottom:-1px;
    border-right:2px solid var(--ink);
    border-bottom:2px solid var(--ink);
  }

  .control-wrap{position:relative}

  .control{
    appearance:none;
    border:1px solid transparent;
    width:48px;height:48px;
    display:grid;
    place-items:center;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    position:relative;
    padding:0;
    transition:
      transform .22s cubic-bezier(.2,.8,.2,1),
      color .2s ease,
      background .2s ease,
      border-color .2s ease;
    outline:none;
  }

  .control::before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid transparent;
    transition:border-color .2s ease, background .2s ease;
  }

  .control::after{
    content:"";
    position:absolute;
    left:9px;right:9px;bottom:4px;
    height:2px;
    background:var(--accent,var(--blue));
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .22s ease;
  }

  .control:hover,
  .control:focus-visible,
  .control[data-active="true"]{
    color:var(--ink);
    transform:translateY(-2px);
  }
  .control:hover::before,
  .control:focus-visible::before,
  .control[data-active="true"]::before{
    border-color:var(--line);
    background:color-mix(in srgb,var(--panel) 76%, transparent);
  }
  .control:hover::after,
  .control:focus-visible::after,
  .control[data-active="true"]::after{
    transform:scaleX(1);
  }

  .control:active{
    transform:translateY(0) scale(.96);
  }

  .control svg{
    width:28px;height:28px;
    stroke:currentColor;
    stroke-width:1.8;
    fill:none;
    position:relative;
    z-index:1;
  }

  .flag{
    width:30px;height:22px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border:1px solid rgba(0,0,0,.08);
    box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;
    position:relative;
    z-index:1;
  }
  .flag span:nth-child(1){background:#009246}
  .flag span:nth-child(2){background:#F1F2F1}
  .flag span:nth-child(3){background:#CE2B37}

  .tooltip{
    position:absolute;
    left:50%;top:calc(100% + 12px);
    transform:translate(-50%,-4px);
    opacity:0;
    pointer-events:none;
    min-width:max-content;
    background:var(--ink);
    color:var(--bg);
    padding:7px 9px 6px;
    font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.12em;
    text-transform:uppercase;
    border-left:2px solid var(--accent,var(--blue));
    box-shadow:0 8px 18px rgba(0,0,0,.16);
    transition:opacity .16s ease,transform .16s ease;
    z-index:30;
  }

  .control-wrap:hover .tooltip,
  .control:focus-visible + .tooltip{
    opacity:1;
    transform:translate(-50%,0);
  }

  .popover{
    position:absolute;
    top:calc(100% + 16px);
    min-width:220px;
    padding:10px;
    background:var(--panel);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(-6px) scale(.985);
    transform-origin:top center;
    pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
    z-index:20;
  }
  .popover.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }

  .popover.left{left:0}
  .popover.center{left:50%;transform:translate(-50%,-6px) scale(.985)}
  .popover.center.open{transform:translate(-50%,0) scale(1)}
  .popover.right{right:0}

  .pop-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 6px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
    font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.13em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .status-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%, transparent);
  }

  .menu-item,.lang-item{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border:0;
    background:transparent;
    color:var(--ink);
    padding:9px 8px;
    cursor:pointer;
    font:650 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .menu-item:hover,.lang-item:hover{
    background:var(--bg-2);
  }
  .menu-item small,.lang-item small{
    color:var(--muted);
    font-size:9px;
  }
  .lang-item.selected{
    box-shadow:inset 2px 0 0 var(--blue);
    background:color-mix(in srgb,var(--blue) 7%, var(--panel));
  }

  .theme-pop{
    min-width:210px;
  }
  .meter{
    margin:10px 6px 4px;
    height:5px;
    background:var(--bg-2);
    overflow:hidden;
  }
  .meter > span{
    display:block;height:100%;width:72%;
    background:linear-gradient(90deg,var(--blue),var(--orange));
  }
  .theme-copy{
    padding:4px 6px 8px;
    color:var(--muted);
    font:600 10px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  .corner-id{
    position:absolute;
    right:22px;
    bottom:20px;
    font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.11em;
    color:var(--muted);
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important}
  }
</style>
</head>
<body data-theme="light">
  <div class="popover center open" hidden aria-hidden="true"></div>
  <main class="stage">
    <div class="guide">Header utility controls / concept 01</div>

    <div class="cluster" aria-label="Portfolio utility controls">
      <div class="control-wrap">
        <button class="control" id="navBtn" aria-label="Apri navigazione" aria-expanded="false" style="--accent:var(--blue)">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="5.5" y="4.5" width="21" height="23" rx="1"></rect>
            <path d="M10 10h12M10 15h12M10 20h8"></path>
          </svg>
        </button>
        <div class="tooltip">NAV / INDEX</div>
        <div class="popover left" id="navPop">
          <div class="pop-head"><span>Mission index</span><span class="status-dot"></span></div>
          <button class="menu-item"><span>Projects</span><small>01</small></button>
          <button class="menu-item"><span>About</span><small>02</small></button>
          <button class="menu-item"><span>Contact</span><small>03</small></button>
        </div>
      </div>

      <div class="control-wrap">
        <button class="control" id="langBtn" aria-label="Cambia lingua" aria-expanded="false" style="--accent:var(--orange)">
          <span class="flag" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <div class="tooltip" id="langTooltip">LANG / IT</div>
        <div class="popover center" id="langPop">
          <div class="pop-head"><span>Language channel</span><span>02</span></div>
          <button class="lang-item selected" data-lang="IT"><span>Italiano</span><small>IT</small></button>
          <button class="lang-item" data-lang="EN"><span>English</span><small>EN</small></button>
        </div>
      </div>

      <div class="control-wrap">
        <button class="control" id="themeBtn" aria-label="Cambia tema" aria-expanded="false" style="--accent:var(--yellow)">
          <svg id="sunIcon" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="5.5" fill="currentColor" stroke="none"></circle>
            <path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M25.2 6.8l-2.8 2.8M9.6 22.4l-2.8 2.8"></path>
          </svg>
        </button>
        <div class="tooltip" id="themeTooltip">MODE / LIGHT</div>
        <div class="popover right theme-pop" id="themePop">
          <div class="pop-head"><span>Display mode</span><span id="modeCode">LIGHT</span></div>
          <div class="theme-copy">Utility control with restrained motion, technical feedback and no gaming-style glow.</div>
          <div class="meter"><span></span></div>
        </div>
      </div>
    </div>

    <div class="corner-id">SYS.UI / STARFIELD-LIGHT / 001</div>
  </main>

<script>
  const controls = [
    {btn: navBtn, pop: navPop},
    {btn: langBtn, pop: langPop},
    {btn: themeBtn, pop: themePop}
  ];

  function closeAll(except=null){
    controls.forEach(({btn,pop})=>{
      if(pop !== except){
        pop.classList.remove('open');
        btn.dataset.active = 'false';
        btn.setAttribute('aria-expanded','false');
      }
    });
  }

  controls.forEach(({btn,pop})=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const willOpen = !pop.classList.contains('open');
      closeAll(pop);
      pop.classList.toggle('open', willOpen);
      btn.dataset.active = willOpen ? 'true' : 'false';
      btn.setAttribute('aria-expanded', String(willOpen));
    });
    pop.addEventListener('click', e=>e.stopPropagation());
  });

  document.addEventListener('click',()=>closeAll());
  document.addEventListener('keydown',(e)=>{
    if(e.key === 'Escape') closeAll();
  });

  document.querySelectorAll('.lang-item').forEach(item=>{
    item.addEventListener('click',()=>{
      document.querySelectorAll('.lang-item').forEach(i=>i.classList.remove('selected'));
      item.classList.add('selected');
      const lang = item.dataset.lang;
      langTooltip.textContent = `LANG / ${lang}`;
      langBtn.animate(
        [{transform:'translateY(-2px) scale(1)'},{transform:'translateY(-2px) scale(.92)'},{transform:'translateY(-2px) scale(1)'}],
        {duration:260,easing:'cubic-bezier(.2,.8,.2,1)'}
      );
      setTimeout(()=>closeAll(),120);
    });
  });

  themeBtn.addEventListener('dblclick', e=>e.preventDefault());
  themePop.addEventListener('click',()=>{
    toggleTheme();
  });
  themeBtn.addEventListener('click',()=>{
    setTimeout(()=>{
      if(themePop.classList.contains('open')) toggleTheme();
    }, 0);
  });

  function toggleTheme(){
    const isDark = document.body.dataset.theme !== "dark";
    document.body.dataset.theme = isDark ? "dark" : "light";
    themeTooltip.textContent = isDark ? 'MODE / DARK' : 'MODE / LIGHT';
    modeCode.textContent = isDark ? 'DARK' : 'LIGHT';
    document.querySelector('.corner-id').textContent =
      `SYS.UI / STARFIELD-${isDark ? 'DARK' : 'LIGHT'} / 001`;
  }
</script>
</body>
</html>
